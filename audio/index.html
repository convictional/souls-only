<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>souls-only-audio</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #111; color: #eee; display: grid; place-items: center; height: 100vh; margin: 0; }
      .panel { width: min(520px, 90vw); text-align: center; }
      input[type="range"] { width: 100%; }
      .val { font-variant-numeric: tabular-nums; font-size: 2rem; margin: 0.5rem 0; }
      button { font-size: 1rem; padding: 0.5rem 1.25rem; cursor: pointer; }
      p.note { color: #888; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>souls-only-audio</h1>
      <button id="toggle">Play</button>
      <div class="val"><span id="revlValue">0</span> / 1000</div>
      <input id="revl" type="range" min="0" max="1000" step="1" value="0" aria-label="Reveal" />
      <p class="note">Press Play, then tune with the arrow keys. Hold Shift for fine steps, Page Up and Page Down to jump. Listen for the voice to come clear.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
